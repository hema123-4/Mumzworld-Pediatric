<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mumzworld Pediatric Triage</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background:#f5f5f0;;
        color: #1a1a18;
        min-height: 100vh;
        padding: 2rem 1rem;
      }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f5f0;
        --color-background-tertiary: #ededea;
        --color-text-primary: #1a1a18;
        --color-text-secondary: #5f5e5a;
        --color-text-tertiary: #888780;
        --color-border-tertiary: rgba(0,0,0,0.12);
        --color-border-secondary: rgba(0,0,0,0.25);
        --color-border-primary: rgba(0,0,0,0.4);
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: Georgia, serif;
        --font-mono: 'SF Mono', Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-primary: #1e1e1c;
          --color-background-secondary: #2a2a28;
          --color-background-tertiary: #333330;
          --color-text-primary: #e8e8e4;
          --color-text-secondary: #a0a09a;
          --color-text-tertiary: #6e6e68;
          --color-border-tertiary: rgba(255,255,255,0.1);
          --color-border-secondary: rgba(255,255,255,0.2);
          --color-border-primary: rgba(255,255,255,0.35);
        }
        body { background: #16161400; }
      }
      textarea, input[type="text"], input[type="number"] {
        background: var(--color-background-secondary);
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        color: var(--color-text-primary);
        outline: none;
        font-family: var(--font-sans);
        transition: border-color 0.15s;
      }
      textarea:focus, input:focus {
        border-color: var(--color-border-primary);
        box-shadow: 0 0 0 2px rgba(0,0,0,0.06);
      }
      button {
        background: transparent;
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        color: var(--color-text-primary);
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background 0.12s, transform 0.08s;
      }
      button:hover:not(:disabled) { background: var(--color-background-secondary); }
      button:active:not(:disabled) { transform: scale(0.98); }
      button:disabled { cursor: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
